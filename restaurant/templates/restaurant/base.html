{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Little Lemon{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'restaurant/css/style.css' %}">
</head>
<body>
<header class="site-header">
    <div class="logo-wrap">
        <div class="lemon-mark">🍋</div>
        <div class="logo-text">LITTLE LEMON</div>
    </div>
    <nav class="nav">
        <a href="{% url 'home' %}">Home</a>
        <a href="#">About</a>
        <a href="#">Menu</a>
        <a href="{% url 'book' %}">Book</a>
        <a href="{% url 'reservations' %}">Reservations</a>
    </nav>
</header>
<main class="container">
    {% block content %}{% endblock %}
</main>
<footer class="footer">
    <div class="footer-mark">🍋</div>
    <div>Copyright Little Lemon</div>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
